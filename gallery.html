<style>
  body{margin:0; font-family:sans-serif; background: linear-gradient(#A7D2EF, #fff);}
  .header{background:#001838; color:white; padding:15px 40px; display:flex; justify-content:space-between; align-items:center;}
  .hero{text-align:center; padding:50px;}
  .hero h1{font-size:70px; color:#001838; margin:0;}
 .grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:20px;
  padding:20px 80px;
}
.card{
  background:white;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
  display:flex;
  flex-direction:column;
  height:300px; /* ثبت ارتفاع الكرت كلو */
}
.card img{
  width:100%;
  height:250px; /* ثبت ارتفاع الصورة */
  object-fit:cover; /* دي بتقص الصورة عشان تملى بدون ما تتمط */
  display:block;
}
.card .info{
  height:50px;
  display:flex;
  align-items:center;
  padding-left:10px;
  background:white;
}.card{
  position:relative;
  cursor:pointer;
}
.card img{
  transition: 0.3s;
}
.card:hover img{
  filter: brightness(40%); /* هنا بتغمض */
}
.card::after{
  content: "شاهد التفاصيل →";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:20px;
  font-weight:bold;
  opacity:0;
  transition:0.3s;
}
.card:hover::after{
  opacity:1;
}

  .tag{background:#8ec0e8; display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px;}
  
</style>
